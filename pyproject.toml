[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "texttosolid"
version = "1.0.0"
description = "Zero-dependency pure-Python parametric solid modeling engine: a text DSL, a BSP CSG boolean kernel, STL/OBJ/SVG exporters and an agent JSON protocol."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "TextToSolid contributors" }]
keywords = ["cad", "csg", "3d", "stl", "obj", "svg", "mesh", "parametric", "solid", "modeling"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Intended Audience :: Developers",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/gitstq/TextToSolid"
Repository = "https://github.com/gitstq/TextToSolid"

[project.scripts]
t2s = "texttosolid.cli:main"

[tool.setuptools.packages.find]
include = ["texttosolid*"]
