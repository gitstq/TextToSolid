name: DEBUG-CSG

on:
  push:
    branches: [main, master]

jobs:
  debug:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Dump union triangles
        shell: bash
        run: |
          python - <<'PY'
          from texttosolid import box
          from texttosolid.csg import union
          m = union(box(10,10,10), box(10,10,10, at=(5,0,0)))
          print("TRIS", m.triangle_count, "watertight", m.is_watertight())
          for fi,(i,j,k) in enumerate(m.faces):
              vs = [m.vertices[i], m.vertices[j], m.vertices[k]]
              print(fi, [(round(v.x,2),round(v.y,2),round(v.z,2)) for v in vs])
          PY
